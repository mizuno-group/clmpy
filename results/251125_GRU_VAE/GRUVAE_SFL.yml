# general
batch_size: 32
num_workers: 0
token_path: /workspace/clmpy_miyabi/sample/tokens/zinc_SFL_tokens.txt
SFL: True
seed: 222
log: True
# model architecture
embedding_dim: 128
enc_gru_layer: [256,512,1024]
latent_dim: 256
dec_gru_layer: [256,512,1024]

# train
steps: 500000
plot: true
dropout: 0.1
max_lr: 1.0e-1
warmup: 8000
patience_step: 200
beta: 1.0
buckets_min: 20
buckets_max: 150
buckets_step: 10
train_data: /workspace/clmpy_miyabi/sample_data/mlp/data_unimol_200/BACE.csv
valid_data: /workspace/clmpy_miyabi/sample_data/mlp/data_unimol_200/BACE.csv
valid_step_range: 20

# inference
maxlen: 500

layer_dim: [256, 512]
task: binary_classification
gamma: 10
dropout_mlp: 0.1
batch_norm: True
